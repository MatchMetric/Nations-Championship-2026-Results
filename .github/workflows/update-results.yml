name: Update results

# Fills in finished Nations Championship matches in results.json using the
# Anthropic API (Claude + web search). Runs that find nothing due exit before
# calling the API, so frequent schedules cost nothing.
#
# One-time setup: Settings > Secrets and variables > Actions > New repository
# secret, name ANTHROPIC_API_KEY, value = your Anthropic API key.

on:
  schedule:
    # Times are UTC. Hourly on match days (Fri-Sun), plus a daily catch-up.
    - cron: "17 * * * 5,6,0"
    - cron: "41 9 * * 1-4"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run - report what would change but don't commit"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-results
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Anthropic SDK
        run: pip install --quiet anthropic

      - name: Look up finished matches
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-sonnet-5-5' }}
          PASSES: "2"
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python scripts/update_results.py

      - name: Commit updated results
        if: ${{ !inputs.dry_run }}
        run: |
          if git diff --quiet -- results.json; then
            echo "results.json unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results.json
          git commit -m "Auto-update results ($(date -u +'%Y-%m-%d %H:%M') UTC)"
          git pull --rebase --quiet
          git push
